version: '3.8'

services:
  # ========================================
  # Nginx - Reverse Proxy
  # ========================================
  nginx:
    image: nginx:alpine
    container_name: engenharia-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - streamlit
    networks:
      - engenharia_network
    restart: unless-stopped

  # ========================================
  # Backend Python - API de Processamento
  # ========================================
  backend:
    build:
      context: ./backend
    container_name: engenharia-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Timezone
      - TZ=America/Sao_Paulo
      
      # OpenAI API Key
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      
      # Porta do servidor
      - PORT=5000
    
    volumes:
      # Pasta compartilhada (uploads e outputs)
      - ./shared_files:/data
      
      # Scripts Python
      - ../python_scripts:/data/python_scripts:ro
    
    networks:
      - engenharia_network
    
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ========================================
  # Serviço Streamlit - Interface Web
  # ========================================
  streamlit:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: engenharia-streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - TZ=America/Sao_Paulo
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/gerar-etp
    
    volumes:
      # Pasta compartilhada com n8n (padronizado para /data)
      - ./shared_files:/data
    
    networks:
      - engenharia_network
    
    depends_on:
      - backend
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# ========================================
# Rede compartilhada
# ========================================
networks:
  engenharia_network:
    driver: bridge
    name: engenharia_network
